<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b18" />
    <title>圣诞快乐 · 来自神仙陈的礼物</title>
    <meta name="description" content="一棵会回应你手势的粒子圣诞树。握拳成树，摊手散开，捏指翻出照片。" />

    <!-- 字体本地化：不再依赖 fonts.googleapis.com，国内也能秒开 -->
    <link rel="preload" href="./fonts/playfair-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/playfair-normal.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      @font-face {
        font-family: 'Playfair Display';
        font-style: italic;
        font-weight: 400 700;
        font-display: swap;
        src: url('./fonts/playfair-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('./fonts/playfair-normal.woff2') format('woff2');
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: #070b18;
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', 'Playfair Display', serif;
      }
      canvas {
        touch-action: none;
      }
      .font-display {
        font-family: 'Playfair Display', 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,217,138,0.35); border-radius: 2px; }
      @keyframes shimmer {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .shimmer { animation: shimmer 3s ease-in-out infinite; }
      @keyframes snowfall-gradient {
        0% { background-position: 0% 0%; }
        100% { background-position: 0% 200%; }
      }

      /* ---------- 手机竖屏适配 ---------- */
      /* 顶部文案原本是 55% 白，压在金色粒子上几乎看不清，给它一点底气 */
      #root p[class*="tracking-[0.3em]"] {
        color: #ffe4b0 !important;
        text-shadow: 0 1px 3px #070b18, 0 0 10px rgba(7, 11, 24, 0.95), 0 0 22px rgba(7, 11, 24, 0.8) !important;
      }
      /* 窄屏下按钮文字别被挤成两行 */
      #root button { white-space: nowrap; }
      @media (max-aspect-ratio: 1/1) {
        /* 窄屏才放开固定宽度，桌面保持原样 */
        #root div[class*="backdrop-blur-md"][class*="rounded-xl"] {
          width: auto !important;
        }
        #root div[class*="backdrop-blur-md"] span { white-space: nowrap; }
      }
    </style>

    <script>
      // 横竖屏切换后重新构图（相机距离是初始化时算的）
      window.addEventListener('orientationchange', function () {
        setTimeout(function () { location.reload(); }, 250);
      });

      // 排查手势用：网址后加 ?debug=1 会在左下角显示识别引擎的实时计数
      if (new URLSearchParams(location.search).has('debug')) {
        var dlgBox = null;
        setInterval(function () {
          var d = window.__gestureDiag;
          if (!d) return;
          if (!dlgBox) {
            dlgBox = document.createElement('div');
            dlgBox.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;background:rgba(0,0,0,.8);color:#ffd98a;font:11px monospace;padding:7px 10px;border-radius:6px;pointer-events:none;white-space:pre;line-height:1.6;max-width:80vw;word-break:break-all';
            document.body.appendChild(dlgBox);
          }
          dlgBox.textContent = '帧 ' + d.frames + ' | 结果 ' + d.results +
            ' | 无手 ' + d.noHand + ' | 发送失败 ' + d.sendErrors +
            (d.lastError ? '\n' + d.lastError : '');
        }, 500);
      }
    </script>

    <!-- 定制配置：想改的名字、祝福语、照片都在这个文件里 -->
    <script src="./custom.config.js"></script>
    <script type="module" crossorigin src="./assets/index-CZPyPNXc.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BeE7YxDE.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="color:#ffd98a;font-family:serif;padding:40px;line-height:1.9">
        这棵树需要 JavaScript 才能亮起来。<br />请换一个现代浏览器（Chrome / Edge / Safari）打开。
      </div>
    </noscript>
  </body>
</html>
